name: daily-report

on:
  schedule:
    - cron: "30 0 * * *" # 每天 08:30 北京时间
  workflow_dispatch:
    inputs:
      region:
        description: TikTok Shop 市场
        required: true
        type: choice
        options: [US, TH, MX, BR, VN, PH, MY, ID, SG, JP, GB, ES, DE, IT, FR]
        default: US
      keywords:
        description: 英文关键词，留空时使用仓库变量 DAILY_KEYWORDS
        required: false
        type: string
        default: ""

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  report:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    env:
      TTSHOP_REGION: ${{ inputs.region || vars.DAILY_MARKET || 'US' }}
      DAILY_KEYWORDS: ${{ inputs.keywords || vars.DAILY_KEYWORDS || '' }}
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install dependencies and Playwright Chromium
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
          python -m playwright install --with-deps chromium

      - name: Collect selected market from TikTok Shop pages
        shell: bash
        run: |
          set -euo pipefail
          REGION="${TTSHOP_REGION^^}"
          if [[ ! "$REGION" =~ ^(US|TH|MX|BR|VN|PH|MY|ID|SG|JP|GB|ES|DE|IT|FR)$ ]]; then
            echo "Unsupported market: $REGION" >&2
            exit 1
          fi
          if [[ -z "${DAILY_KEYWORDS//[[:space:]]/}" ]]; then
            echo "No keywords configured. Enter keywords in the dashboard first." >&2
            exit 1
          fi
          mkdir -p data reports
          DB_PATH="data/tiktok_shop_${REGION}.db"
          IFS=',' read -r -a KEYWORDS <<< "$DAILY_KEYWORDS"
          COLLECTED_KEYWORDS=0
          for RAW_KEYWORD in "${KEYWORDS[@]}"; do
            KEYWORD="$(printf '%s' "$RAW_KEYWORD" | xargs)"
            [[ -z "$KEYWORD" ]] && continue
            echo "Playwright collection: market=$REGION keyword=$KEYWORD"
            TTSHOP_REGION="$REGION" python main.py --db "$DB_PATH" run               --source scraper --keyword "$KEYWORD" --limit 30
            COLLECTED_KEYWORDS=$((COLLECTED_KEYWORDS + 1))
          done
          if [[ "$COLLECTED_KEYWORDS" -eq 0 ]]; then
            echo "No usable search keywords were provided." >&2
            exit 1
          fi
          TTSHOP_REGION="$REGION" python main.py --db "$DB_PATH" report             --source scraper --output "reports/tiktok_shop_report_${REGION}.html"
          cp "$DB_PATH" "reports/tiktok_shop_${REGION}.db"
          cp "reports/tiktok_shop_report_${REGION}.html" reports/index.html
          echo "Collected market: $REGION; keywords: $COLLECTED_KEYWORDS"

      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: reports

      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
